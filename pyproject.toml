[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "painel-agentes"
version = "0.1.0"
description = "Painel de agentes de IA para Mercado Livre e Shopee integrado ao Olist ERP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "cryptography>=43",
    "httpx>=0.27",
    "tenacity>=9",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
    "anthropic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]

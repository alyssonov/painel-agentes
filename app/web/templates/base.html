<!doctype html>
<html lang="pt-BR" data-theme="{{ theme or 'dark' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>
  <title>{% block title %}Painel{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/robo-cabeca.svg?v={{ asset_v }}">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png?v={{ asset_v }}">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_v }}">
  <script src="/static/vendor/htmx.min.js?v={{ asset_v }}" defer></script>
  <script src="/static/js/app.js?v={{ asset_v }}" defer></script>
  <script src="/static/js/assistente.js?v={{ asset_v }}" defer></script>
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  {% include "_icons.html" %}
  {% block body %}{% endblock %}
</body>
</html>
